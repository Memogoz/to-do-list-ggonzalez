{% extends 'base.html' %}

{% block head %}
<title>To do list</title>
{% endblock %}

{% block body %}
<div class="min-h-screen bg-no-repeat bg-cover bg-center"
	style="background-image: url('https://images.unsplash.com/photo-1486520299386-6d106b22014b?ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&ixlib=rb-1.2.1&auto=format&fit=crop&w=1050&q=80')">
	<div class="flex justify-end">
		<div class="md:bg-white bg-white/75 min-h-screen w-full md:w-1/2 flex justify-center items-center">
			<div>

				<form action="/login" method="POST">
					<div>
						<span class="text-sm text-gray-900">Welcome back</span>
						<h1 class="text-2xl font-bold">Login to your account</h1>
					</div>
					<div class="mt-5">
						<label class="block text-md mb-2" for="password">User or Email</label>
                        <input class="px-4 w-full border-2 py-2 rounded-md text-sm outline-none" type="text" name="user" placeholder="user / email">
                    </div>
                    <div class="my-3">
                        <label class="block text-md mb-2" for="email">Password</label>
                        <input class="px-4 w-full border-2 py-2 rounded-md text-sm outline-none" type="password" name="password" placeholder="email">
                    </div>
							<div class="flex justify-between">
								
							</div>
							<div class="">
                                <input class="mt-4 mb-3 w-full bg-green-500 hover:bg-green-400 text-white py-2 rounded-md transition duration-100" type="submit" value="Login">
								<div class="flex  space-x-2 justify-center items-end bg-gray-700 hover:bg-gray-600 text-white py-2 rounded-md transition duration-100">

            <img class=" h-5 cursor-pointer" src="https://i.imgur.com/arC60SB.png" alt="">
									<a href="/google">Or sign-in with google</a>
							</div>
				</form>
				<p class="mt-8"> Dont have an account? <a class="cursor-pointer mt-8 text-blue-600" href="/signIn">Join now</a></p>
			</div>
		</div>
	</div>
</div>
</div>
{% endblock %}
